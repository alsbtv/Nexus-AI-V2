name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write # هذه الصلاحية ضرورية لإنشاء الـ Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2
        cache-read-only: false

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload APK to Artifacts (احتياطي)
      uses: actions/upload-artifact@v4
      with:
        name: Nexus-AI-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.${{ github.run_number }} # رقم الإصدار يتزايد تلقائياً
        name: Nexus AI Release v1.0.${{ github.run_number }}
        body: |
          تحديث جديد لتطبيق Nexus AI!
          - إصلاح تسجيل الدخول.
          - تقليل حجم التطبيق.
          - إضافة ميزة التحديث التلقائي.
        files: app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
